#[![Automatic doc checks](https://github.com/canonical/landscape-documentation/actions/workflows/automatic-doc-checks.yml/badge.svg)](https://github.com/canonical/landscape-documentation/actions/workflows/automatic-doc-checks.yml)
name: Automatic doc checks

on:
  push:
    branches: [ main ]
  pull_request:

  workflow_dispatch:
    # Manual trigger


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-checks:
    uses: canonical/documentation-workflows/.github/workflows/documentation-checks.yaml@main
    with:
      working-directory: "docs"
      fetch-depth: 0
